labs:
  - id: lab1
    title: Build a Capacitance Meter
    goal: Measure C by timing the RC charge to 63.2 %, and find out how accurate your capacitors' labels are.
    minutes: 45
    parts:
      - "10 kΩ and 1 MΩ resistors, 220 Ω resistor"
      - "10 µF and 100 µF electrolytic, 100 nF ceramic (104)"
      - "Arduino Uno"
    schematic: u03_cap_meter
    sketch: u03_cap_meter
    wiring:
      - ["D8", "R_CHARGE (10 kΩ) → test node"]
      - ["D9", "220 Ω → test node"]
      - ["test node", "A0 and capacitor + leg"]
      - ["capacitor − leg (stripe)", "GND"]
    steps:
      - type: numeric
        q: "Predict τ for R = 10 kΩ and C = 100 µF."
        answer: 1.0
        calc: "10e3 * 100e-6"
        unit: s
        tol: 1%
        explain: "τ = RC = 10 000 × 0.0001 = 1 s."
      - "Measure your 10 kΩ resistor and put the real value in R_CHARGE. Build the circuit with the 10 µF capacitor (stripe to GND)."
      - type: measure
        q: "Upload u03_cap_meter. Reading for the 10 µF capacitor?"
        expected: 10
        calc: "10"
        unit: µF
        tol: 25%
        explain: "Electrolytics are typically ±20 %. If yours reads 8.7 or 11.5 µF, that's the part, not your meter."
      - type: measure
        q: "Swap in the 100 µF capacitor. Reading?"
        expected: 100
        calc: "100"
        unit: µF
        tol: 25%
        explain: "Same story: ±20 % parts. Notice how long each measurement now takes (τ ≈ 1 s)."
      - type: numeric
        q: "With 10 kΩ, a 100 nF cap has τ = 1 ms. Each analogRead() takes ~0.11 ms. Roughly what % timing error does that give?"
        answer: 11
        calc: "0.11 / 1.0 * 100"
        unit: "%"
        tol: 15%
        explain: "Up to one ADC read late → ~0.11 ms out of 1 ms ≈ 11 %. Too coarse — so for nanofarads, use a much bigger R."
      - "Change R_CHARGE to 1 MΩ in the circuit AND in the code. Measure the 100 nF (104) ceramic capacitor."
      - type: measure
        q: "Reading for the 104 capacitor with the 1 MΩ resistor."
        expected: 100
        calc: "100"
        unit: nF
        tol: 30%
        explain: "Now τ ≈ 100 ms and the ADC timing error is ~0.1 %. Cheap ceramics can be far off their label — another real-world lesson."
      - type: mcq
        q: "A 1 MΩ source is far above the ADC's 10 kΩ rule from Unit 1. Why does this measurement still work?"
        options:
          - "It doesn't; the readings are random"
          - "The capacitor under test is itself a low-impedance source for the tiny sample-and-hold cap"
          - "The ADC switches to a high-impedance mode automatically"
          - "Because D9 is an input"
        answer: 1
        explain: "100 nF vs ~14 pF: the cap under test barely notices the ADC 'sipping' charge. Charge is supplied by the test cap, not by the 1 MΩ."
    observe: |
      Bigger capacitors take visibly longer per measurement. Each reading repeats within a fraction of a percent, but differs from the printed value by up to ~20 %. Precision and accuracy are different things.
    troubleshooting:
      - ["Always 'too big / no connection'", "D8 isn't reaching the test node or the capacitor is backwards/shorted."]
      - ["Reads ~0 for everything", "The node is shorted to 5 V, or D9 is wired straight to the node without the 220 Ω."]
      - ["Values drift between readings", "Electrolytics have leakage; small drift is real. Big drift: loose breadboard contact."]
    challenges:
      - "Auto-range: wire BOTH a 10 kΩ (from D8) and a 1 MΩ (from D10) to the node. Try the fast range first; if τ < 10 ms, switch to the slow range."
      - "Measure two 10 µF caps in parallel, then in series. Check C_parallel = C1 + C2 and 1/C_series = 1/C1 + 1/C2."

  - id: lab2
    title: PWM + RC = a homemade DAC
    goal: See the exponential step response on the Serial Plotter and trade ripple against speed.
    minutes: 40
    parts:
      - "10 kΩ and 1 kΩ resistors"
      - "10 µF electrolytic"
      - "Arduino Uno, multimeter"
    schematic: u03_rc_dac
    sketch: u03_rc_dac
    wiring:
      - ["D9", "R (start with 10 kΩ) → filter node"]
      - ["filter node", "A0 and capacitor +"]
      - ["capacitor −", "GND"]
    steps:
      - type: numeric
        q: "analogWrite(9, 128) — what average voltage should the filter output?"
        answer: 2.51
        calc: "128 / 255 * 5"
        unit: V
        tol: 2%
        explain: "D = 128/255 = 50.2 % → 2.51 V."
      - type: numeric
        q: "Cut-off frequency of 10 kΩ + 10 µF?"
        answer: 1.59
        calc: "1 / (2 * 3.14159265 * 10e3 * 10e-6)"
        unit: Hz
        tol: 2%
        explain: "1/(2π × 0.1 s) ≈ 1.6 Hz — 300 times below the 490 Hz PWM, so the PWM is heavily filtered."
      - "Build with 10 kΩ. Upload u03_rc_dac and open the Serial PLOTTER. Watch the steps: the filtered trace curves towards each new target."
      - "Send '5' (fixed duty 5/9 ≈ 56 %) and measure the filter node with your meter."
      - type: measure
        q: "Meter reading at duty 5/9 (the sketch sets analogWrite(9, 141))."
        expected: 2.765
        calc: "(5 * 255 // 9) / 255 * 5"
        unit: V
        tol: 5%
        explain: "141/255 × 5 = 2.76 V (scaled by your real 5 V rail)."
      - type: numeric
        q: "Predict the ripple at 50 % duty for 10 kΩ + 10 µF at 490 Hz, in mV."
        answer: 25.5
        calc: "5 * 0.5 * 0.5 / (490 * 10e3 * 10e-6) * 1000"
        unit: mV
        tol: 3%
        explain: "5 × 0.25 / (490 × 0.1) = 0.0255 V ≈ 26 mV — only about 5 ADC counts."
      - "Swap the 10 kΩ for 1 kΩ (τ = 10 ms). Send '4' or '5' and then 'r' for a fast ripple burst."
      - type: numeric
        q: "Predict the ripple at 50 % duty now (1 kΩ + 10 µF), in V."
        answer: 0.255
        calc: "5 * 0.25 / (490 * 1e3 * 10e-6)"
        unit: V
        tol: 3%
        explain: "Ten times smaller RC → ten times more ripple: ~0.26 V."
      - type: record
        q: "Ripple p-p reported by the 'r' burst with 1 kΩ."
        unit: V
      - type: mcq
        q: "Compared to 10 kΩ, the 1 kΩ filter…"
        options:
          - "settles 10× faster but has 10× more ripple"
          - "settles 10× slower with less ripple"
          - "behaves the same — only C matters"
          - "has no ripple because the resistor is smaller"
        answer: 0
        explain: "Both the settling time (5τ) and the ripple scale with RC, in opposite directions. That's the trade-off every filter makes."
    observe: |
      With 10 kΩ the trace is smooth but takes ~0.5 s (5τ) to reach each new level. With 1 kΩ it snaps to the new level in ~50 ms but the 'r' burst shows a clear triangle-ish ripple at the PWM frequency.
    troubleshooting:
      - ["Filtered trace is a flat line at 0", "Electrolytic backwards or not connected to A0."]
      - ["Trace looks like a fuzzy band", "That IS the ripple, sampled at random moments. Use 'r' to see its shape."]
    challenges:
      - "Add a second RC stage (1 kΩ + 10 µF after the first). Two-pole filter: ripple drops dramatically while the response stays reasonably fast. Measure it with 'r'."
      - "Move the PWM to pin 5 (~980 Hz). Predict and measure how the ripple changes."

quiz:
  - type: numeric
    q: "How long until an RC circuit with R = 47 kΩ, C = 22 µF is 99 % charged? (≈ 4.6 τ)"
    answer: 4.76
    calc: "4.6 * 47e3 * 22e-6"
    unit: s
    tol: 3%
    explain: "τ = 47 000 × 22 µF = 1.034 s; × 4.6 ≈ 4.8 s."
  - type: numeric
    q: "Energy stored in a 100 µF capacitor at 5 V, in millijoules?"
    answer: 1.25
    calc: "0.5 * 100e-6 * 5**2 * 1000"
    unit: mJ
    tol: 1%
    explain: "½ × 100 µF × 25 = 1.25 mJ."
  - type: mcq
    q: "A capacitor is charged at a constant 1 mA. C = 100 µF. How fast does its voltage rise?"
    options: ["0.1 V/s", "1 V/s", "10 V/s", "100 V/s"]
    answer: 2
    explain: "dV/dt = I/C = 0.001 / 0.0001 = 10 V/s."
  - type: truefalse
    q: "The voltage across a capacitor can change instantly if you connect it to a big enough battery."
    answer: false
    explain: "An instant change would need infinite current (I = C·dV/dt). Real circuits limit it with resistance — that's why we use a series R."
  - type: numeric
    q: "After exactly 2τ of charging from 0 V towards 5 V, what's the capacitor voltage?"
    answer: 4.32
    calc: "5 * (1 - 2.718281828**-2)"
    unit: V
    tol: 2%
    explain: "5 × (1 − e⁻²) = 5 × 0.865 = 4.32 V."
  - type: mcq
    q: "Which change gives LESS ripple on a PWM-RC DAC without slowing it down?"
    options:
      - "Bigger R"
      - "Bigger C"
      - "Higher PWM frequency"
      - "Lower duty cycle"
    answer: 2
    explain: "Ripple ∝ 1/(f·RC). Raising f cuts ripple with the same RC (same speed). That's why serious PWM DACs run at tens of kHz."
  - type: numeric
    q: "A ceramic cap reads 0.068 µF on the meter. What code is printed on it (3 digits)?"
    answer: 683
    calc: "683"
    unit: ""
    tol: 0
    explain: "0.068 µF = 68 nF = 68 000 pF = 68 × 10³ → 683."
  - type: codeline
    q: "This capacitance meter always shows a huge value. Which line is wrong?"
    code: |
      digitalWrite(CHARGE_PIN, HIGH);
      unsigned long start = micros();
      while (analogRead(SENSE_PIN) < 647) {}
      unsigned long tau = micros() - start;
      float uF = tau * R_CHARGE;
    answer: 5
    explain: "C = τ / R, not τ × R. (Also, ideally start the timer right before raising the pin.)"
  - type: order
    q: "Order these by how full a charging capacitor is."
    items:
      - "1 τ — 63 %"
      - "2 τ — 86 %"
      - "3 τ — 95 %"
      - "5 τ — 99.3 %"
    explain: "Each τ closes 63 % of the remaining gap."

flashcards:
  - ["Capacitor current", "I = C · dV/dt"]
  - ["Time constant", "τ = R·C (Ω × F = s)"]
  - ["Charge after 1τ / 5τ", "63.2 % / 99.3 %"]
  - ["Measuring C with an Arduino", "Time to 63.2 % = τ → C = τ / R (µs / Ω = µF)"]
  - ["RC low-pass cut-off", "f_c = 1 / (2πRC)"]
  - ["Uno PWM frequencies", "~490 Hz (pins 3, 9, 10, 11), ~980 Hz (pins 5, 6)"]
  - ["Electrolytic polarity", "Stripe = minus. Typical tolerance ±20 %."]
  - ["PWM average", "V_avg = D × V_high"]
